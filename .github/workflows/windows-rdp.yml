
name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Check Windows Boot Configuration
        shell: powershell
        run: |
          Write-Host "Checking Windows boot configuration..."
          bcdedit /enum "{current}"

          $boot = bcdedit /enum "{current}"
          if ($boot -match "testsigning\s+Yes") {
            Write-Host "WARNING: Test Signing is enabled."
          } else {
            Write-Host "Test Signing is not enabled."
          }

      - name: 2. Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 3. Create Admin Account
        shell: powershell
        run: |
          $Password = Read-Host "Enter password" -AsSecureString

          if (-not (Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue)) {
            New-LocalUser `
              -Name "NvDAdmin" `
              -Password $Password `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

      - name: 4. Install Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if (-not $Env:TAILSCALE_AUTHKEY) {
            throw "TAILSCALE_AUTHKEY secret is missing."
          }

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Start-Process msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host "=================================="
          Write-Host "RDP SERVER IS READY"
          Write-Host "Tailscale IP: $ts_ip"
          Write-Host "Username: NvDAdmin"
          Write-Host "=================================="

      - name: 5. Check Test Signing Again
        shell: powershell
        run: |
          bcdedit /enum "{current}"

          $result = bcdedit /enum "{current}"

          if ($result -match "testsigning\s+Yes") {
            Write-Warning "Test Mode is still enabled."
          } else {
            Write-Host "Test Mode is disabled in boot configuration."
          }

      - name: 6. Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }
