name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Verify Actual Runner
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Format-List Caption, Version, BuildNumber
          hostname        
      - name: Force Disable Test Signing
        shell: powershell
        run: |
          Write-Host "Disabling Test Signing..."

          bcdedit.exe /set '{current}' testsigning off
          bcdedit.exe /set '{current}' nointegritychecks off

          Write-Host "`n--- BCD STATUS ---"
          bcdedit.exe /enum '{current}'

          Write-Host "`n--- WINDOWS BUILD ---"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

          Write-Host "`n--- CODE INTEGRITY ---"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public class CIStatus {
              [StructLayout(LayoutKind.Sequential)]
              public struct INFO {
                  public UInt32 Length;
                  public UInt32 Options;
              }

              [DllImport("ntdll.dll")]
              public static extern int NtQuerySystemInformation(
                  int Class, ref INFO Info, int Length, IntPtr ReturnLength
              );
          }
          '@

          $info = New-Object CIStatus+INFO
          $info.Length = 8
          $status = [CIStatus]::NtQuerySystemInformation(103, [ref]$info, 8, [IntPtr]::Zero)

          "NTSTATUS: $status"
          "CI Options: 0x{0:X8}" -f $info.Options
          "Test Signing Active: " + [bool]($info.Options -band 0x2)
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "@Erfangamer12" -AsPlainText -Force
          New-LocalUser -Name "AhoraXY" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "AhoraXY" -ErrorAction SilentlyContinue
          net user runneradmin @Erfangamer12
      - name: 2.5 Disable Test Signing and Verify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== DISABLING TEST SIGNING ====="

          bcdedit.exe /set '{current}' testsigning off
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to disable testsigning"
          }

          bcdedit.exe /set '{current}' nointegritychecks off
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to disable nointegritychecks"
          }

          Write-Host "`n===== VERIFY BCD ====="
          bcdedit.exe /enum '{current}'

          Write-Host "`n===== VERIFY KERNEL CODE INTEGRITY ====="

          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;

          public class KernelCIModeCheck {
              [StructLayout(LayoutKind.Sequential)]
              public struct CI_INFO {
                  public uint Length;
                  public uint Options;
              }

              [DllImport("ntdll.dll")]
              public static extern int NtQuerySystemInformation(
                  int SystemInformationClass,
                  ref CI_INFO SystemInformation,
                  int SystemInformationLength,
                  IntPtr ReturnLength
              );
          }
          "@

          $ci = New-Object KernelCIModeCheck+CI_INFO
          $ci.Length = 8

          $status = [KernelCIModeCheck]::NtQuerySystemInformation(
              103, [ref]$ci, 8, [IntPtr]::Zero
          )

          if ($status -ne 0) {
              throw "Could not query kernel Code Integrity status"
          }

          Write-Host ("CI Options: 0x{0:X8}" -f $ci.Options)

          $testSigning = (($ci.Options -band 2) -ne 0)

          Write-Host "BCD Test Signing: OFF"
          Write-Host "Running Kernel Test Signing: $testSigning"

          if ($testSigning) {
              Write-Warning "Test Signing is still active in the current kernel. A reboot is required."
          }
      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Download and install Tailscale silently
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          # Connect to Tailscale network
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          
          Start-Sleep -Seconds 8
          
          # Get Tailscale IP
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : AhoraXY" -ForegroundColor Yellow
          Write-Host "  Password     : @Erfangamer12" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green
      - name: 4. Keep Server Alive
        shell: powershell
        run: |
          $i = 0
          while ($true) {
            $i++
            Start-Sleep -Seconds 60
            Write-Host "[$i] Server is running..."
            }
